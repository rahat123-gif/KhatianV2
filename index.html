.expenseItem.paid{background:color-mix(in srgb,var(--green1) 16%,var(--card));border-color:color-mix(in srgb,var(--green1) 45%,var(--line))}.expenseItem.paid input{background:var(--soft)}
.expenseItem.unpaid{border-left:4px solid var(--red2)}
.expenseItem.unpaid .btn.danger{background:color-mix(in srgb,var(--red1) 18%,var(--card));color:var(--red2)}.expenseItem.paid .btn.success{background:color-mix(in srgb,var(--green1) 22%,var(--card));color:var(--green2)}
.txitem.in{border-left-color:var(--green2)}.txitem.out{border-left-color:var(--red2)}
.stat{box-shadow:var(--shadow)}.balance{background:var(--card);border:1px solid var(--line)}
.due-person{background:var(--card);border:1px solid var(--line)}
.swatch.sel{outline-color:var(--gold)}
.chip2.on{color:#fbf1d9}
.toast{background:#2b2013;color:#f6ead0;border:1px solid var(--gold)}
.modal{background:#1a110877}.modalbox{background:var(--card);border:1px solid var(--line);border-radius:16px}
.authlogo{border-radius:50%;border:3px solid var(--gold);box-shadow:0 0 0 4px var(--card);background:linear-gradient(135deg,var(--a1),var(--a2))}
.err{color:var(--red2)}
/* home */
.pcard{display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.pbody{min-width:0;flex:1}.hname{font-size:26px;font-weight:700;line-height:1.15;color:var(--ink);word-break:break-word}
.hsub{color:var(--muted);font-size:15px;margin:3px 0 9px}.ep{width:auto;padding:7px 16px}
.hav{width:92px;height:92px;border:3px solid var(--gold);box-shadow:0 0 0 4px var(--card),0 0 0 5px #d9c08a;background:linear-gradient(135deg,var(--a1),var(--a2));color:#f9eed2;font-family:var(--serif);font-size:38px}
.cam{right:0;bottom:0;background:var(--card);border:1px solid var(--line);color:var(--ink)}
.banner{position:relative;overflow:hidden;border-radius:16px;padding:18px 16px 14px;color:#fff;background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:var(--shadow);margin-bottom:12px;border:1px solid #0003}
.banner:after{content:'';position:absolute;right:-50px;top:-60px;width:170px;height:170px;border-radius:50%;background:#ffffff0f}
.banner>*{position:relative}.banner h1{margin:0 0 4px;font-size:29px;line-height:1.2;color:#fff}.banner p{margin:0;font-size:15.5px;opacity:.92}
.banner .mbar{margin-top:14px}.banner .rule{height:1px;margin:14px 0 10px;background:linear-gradient(90deg,#e3c37a99,#e3c37a22)}
.banner .brand{font-size:12px;letter-spacing:.38em;color:#e6c97f;font-weight:600}
.tiles{gap:10px}.tile{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 14px 12px;box-shadow:var(--shadow)}
.tile:before{content:'';position:absolute;inset:0 0 auto;height:5px;background:linear-gradient(90deg,var(--a1),var(--a2))}
.tile .ic{background:none;width:44px;height:44px;font-size:32px;border-radius:0}
.tile .tt b{font-family:var(--serif);font-size:16.5px;color:var(--ink)}.tile .tt span{color:var(--muted);font-size:12.5px}
.tile em{color:color-mix(in srgb,var(--a1) 60%,var(--ink));font-family:var(--serif);font-weight:700;font-size:15px}
.setbtn{width:100%;margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;font-family:var(--serif);font-weight:700;font-size:17px;color:var(--ink);box-shadow:var(--shadow)}
.pname{font-family:var(--serif)}
@media print{html,body{background:#fff!important}.printPage .pname,.printPage h2{font-family:var(--serif)}}
.stat .n,.bigmoney{color:inherit}.balance .n,.balance b{color:color-mix(in srgb,var(--a1) 60%,var(--ink))}

/* ===== TYPOGRAPHY ===== */
:root{--fen:'Lora';--fbn:'Noto Serif Bengali';--font:var(--fen),var(--fbn),'Noto Sans Bengali','Hind Siliguri',Georgia,'Times New Roman',serif;--serif:var(--font)}
html,body,button,input,select,textarea{font-family:var(--font)}
html,body{line-height:1.5;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;font-kerning:normal;font-optical-sizing:auto}
h1,h2,h3,.title,.hname,.tile .tt b,.setbtn,.pname{letter-spacing:.1px;line-height:1.3}
.bigmoney,.tile em,.stat .n,.hsub,.mlabel,.table td,.table th,.due td,.due th,input[type=number],.rt td,.rt th,.balance b{font-variant-numeric:lining-nums tabular-nums}
.banner .brand{font-family:var(--font);font-weight:600}
.btn,.chip2,.mb{font-weight:600;letter-spacing:.1px}
label,.lbl2,.note,.muted{letter-spacing:.1px}
.fprev{margin:2px 0 8px;padding:9px 12px;border-radius:10px;background:var(--soft);border:1px dashed var(--line)}
.fp1{font-size:18px;font-weight:700;line-height:1.35}.fp2{font-size:13px;color:var(--muted);margin-top:2px}
.table td textarea.why{height:auto;min-height:32px;line-height:1.35;overflow:hidden;resize:none;white-space:pre-wrap;overflow-wrap:anywhere;margin:0;display:block}.table td{vertical-align:middle}</style><style id="enfonts">

function photoPick(inp){let f=inp.files&&inp.files[0];if(!f)return;const fail=()=>toast('ছবি পড়া যায়নি, অন্য একটি ছবি দিন');const draw=(im,w,h)=>{let c=document.createElement('canvas'),x=c.getContext('2d'),s=Math.min(w,h),sx=(w-s)/2,sy=(h-s)/2,N=256;c.width=c.height=N;x.drawImage(im,sx,sy,s,s,0,0,N,N);putPhoto(c.toDataURL('image/jpeg',.85))};const viaImg=()=>{let url=URL.createObjectURL(f),im=new Image();im.onload=()=>{try{draw(im,im.naturalWidth,im.naturalHeight)}catch(e){fail()}URL.revokeObjectURL(url)};im.onerror=()=>{URL.revokeObjectURL(url);fail()};im.src=url};toast('ছবি প্রসেস হচ্ছে…');if(window.createImageBitmap){createImageBitmap(f,{resizeWidth:512,resizeQuality:'medium'}).then(bm=>{try{draw(bm,bm.width,bm.height)}catch(e){fail()}if(bm.close)bm.close()}).catch(viaImg)}else viaImg();try{inp.value=''}catch(e){}}

function printPage(){let m=state.printMonth||state.month,old=state.month;state.month=m;let d=data(),u=user(),S=state.pdf,days=new Date(+m.slice(0,4),+m.slice(5),0).getDate(),ml,out='';try{ml=new Date(m+'-01T00:00:00').toLocaleString(state.lang==='en'?'en-US':'bn-BD',{month:'long',year:'numeric'})}catch(e){ml=m}
if(S.meals){let mt=0,r='';for(let i=1;i<=days;i++){let k=d.meals[i];if(!k)continue;mt+=Number(k.meal)||0;r+=`<tr><td>${dateLabel(m+'-'+String(i).padStart(2,'0'))}</td><td>${nums(k.meal??'')}</td><td>${esc(k.reason||'')}</td></tr>`}out+=`<h2>🍚 মিল হিসাব — মোট ${money(mt)}</h2>`+(r?`<table class="rt"><tr><th>তারিখ</th><th>মিল</th><th>কারণ</th></tr>${r}</table>`:`<p class="empty">কোনো তথ্য নেই</p>`)}
if(S.exp){let sum=d.exp.reduce((a,x)=>a+(Number(x.amount)||0),0),paid=d.exp.reduce((a,x)=>a+(x.paid?Number(x.amount)||0:0),0),r=d.exp.map(x=>`<tr><td>${esc(x.name)}</td><td>৳ ${money(x.amount)}</td><td>${x.paid?'জমা':'বাকি'}</td></tr>`).join('');out+=`<h2>💰 মাসিক খরচ — মোট ৳ ${money(sum)}</h2>`+(r?`<table class="rt"><tr><th>খাত</th><th>টাকা</th><th>অবস্থা</th></tr>${r}<tr><th>পরিশোধ ৳ ${money(paid)}</th><th>বাকি ৳ ${money(sum-paid)}</th><th></th></tr></table>`:`<p class="empty">কোনো তথ্য নেই</p>`)}
if(S.tx){let inc=0,ou=0,r=d.tx.map(x=>{let a=Number(x.amount)||0;if(x.type==='in')inc+=a;else ou+=a;return `<tr><td>${dateLabel(x.date)}</td><td>${x.type==='in'?'আয়':'ব্যায়'} ৳ ${money(a)}</td><td>${esc(x.reason||'')}</td></tr>`}).join('');out+=`<h2>📊 আয় - ব্যায় — অবশিষ্ট ৳ ${money(inc-ou)}</h2>`+(r?`<table class="rt"><tr><th>তারিখ</th><th>পরিমাণ</th><th>কারণ</th></tr>${r}<tr><th>আয় ৳ ${money(inc)}</th><th>ব্যয় ৳ ${money(ou)}</th><th></th></tr></table>`:`<p class="empty">কোনো তথ্য নেই</p>`)}
if(S.dues){let c=['rent','elec','wifi','cook','due'],r=d.dues.map(x=>`<tr><td>${esc(x.name)}</td>${c.map(k=>`<td>${money(x[k])}</td>`).join('')}</tr>`).join(''),t=c.map(k=>`<th>${money(d.dues.reduce((a,x)=>a+Number(x[k]||0),0))}</th>`).join('');out+=`<h2>👥 সদস্যদের মাসিক বকেয়া</h2>`+(r?`<table class="rt"><tr><th>নাম</th><th>বাসা ভাড়া</th><th>বিদ্যুৎ</th><th>ওয়াইফাই</th><th>বুয়া</th><th>বকেয়া</th></tr>${r}<tr><th>মোট</th>${t}</tr></table>`:`<p class="empty">কোনো তথ্য নেই</p>`)}
state.month=old;return `<div class="app"><main class="main"><div class="actions noPrint" style="margin-bottom:12px"><button class="btn ghost" onclick="state.page='settings';render()">← ফিরুন</button><button class="btn primary" onclick="window.print()">🖨 PDF / প্রিন্ট</button></div><section class="page printPage active"><div class="phead">${u.photo?`<img class="pav" src="${u.photo}" alt="">`:`<div class="pav">${esc(initials())}</div>`}<div class="pinfo2"><div class="pbrand">খতিয়ান</div><div class="pname">${esc(u.name)}</div><div class="pmonth">📅 ${esc(ml)}</div></div></div>${out}<p class="foot">Developed by RaHaT</p></section></main></div>`}
